<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RSVP Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: 'Montserrat', Arial, sans-serif;
    background-color: #FBEAD9;
    margin: 0;
    padding: 24px;
    color: #3A2416;
  }
  h1 {
    color: #6B4226;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #6FAFC4;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  button {
    background: #6B4226;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { opacity: 0.9; }
  .summary {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: white;
    border-radius: 12px;
    padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    min-width: 120px;
  }
  .stat-card .num {
    font-size: 1.4rem;
    font-weight: 600;
    color: #6B4226;
  }
  .stat-card .label {
    font-size: 0.75rem;
    color: #7B6E5A;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  th, td {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid #F2D9C4;
    font-size: 0.85rem;
  }
  th {
    background: #F2B88E;
    color: #4A2C17;
    font-weight: 600;
  }
  tr:hover { background: #FFF6EE; }
  .yes { color: #2E7D32; font-weight: 600; }
  .no { color: #C0392B; font-weight: 600; }
  .maybe { color: #6FAFC4; font-weight: 600; }
  .empty-state {
    text-align: center;
    padding: 40px;
    color: #7B6E5A;
  }
  .msg-cell {
    max-width: 220px;
    white-space: normal;
  }
</style>
</head>
<body>

<h1>RSVP Dashboard</h1>
<div class="subtitle">Marie &amp; Virgillard's Wedding</div>

<div class="summary" id="summary"></div>

<div class="toolbar">
  <button onclick="loadRsvps()">Refresh</button>
  <button onclick="exportCSV()">Export CSV</button>
</div>

<div id="tableWrap"></div>

<script>
  let currentData = [];

  async function loadRsvps() {
    const tableWrap = document.getElementById('tableWrap');
    tableWrap.innerHTML = '<div class="empty-state">Loading...</div>';
    try {
      const res = await fetch('/api/rsvp', { credentials: 'include' });
      if (!res.ok) throw new Error('Failed to load (' + res.status + ')');
      currentData = await res.json();
      renderSummary(currentData);
      renderTable(currentData);
    } catch (err) {
      tableWrap.innerHTML = '<div class="empty-state">Error loading RSVPs: ' + err.message + '</div>';
    }
  }

  function renderSummary(data) {
    const yes = data.filter(r => r.attending === true).length;
    const no = data.filter(r => r.attending === false && !r.maybeResponseDate).length;
    const maybe = data.filter(r => r.attending === false && r.maybeResponseDate).length;
    document.getElementById('summary').innerHTML = `
      <div class="stat-card"><div class="num">${data.length}</div><div class="label">Total RSVPs</div></div>
      <div class="stat-card"><div class="num">${yes}</div><div class="label">Attending</div></div>
      <div class="stat-card"><div class="num">${no}</div><div class="label">Not attending</div></div>
      <div class="stat-card"><div class="num">${maybe}</div><div class="label">Maybe</div></div>
    `;
  }

  function renderTable(data) {
    const tableWrap = document.getElementById('tableWrap');
    if (!data.length) {
      tableWrap.innerHTML = '<div class="empty-state">No RSVPs yet.</div>';
      return;
    }
    let rows = data.map(r => {
      let statusLabel, statusClass;
      if (r.attending === true) { statusLabel = 'Attending'; statusClass = 'yes'; }
      else if (r.maybeResponseDate) { statusLabel = 'Maybe'; statusClass = 'maybe'; }
      else { statusLabel = 'Not attending'; statusClass = 'no'; }

      const date = r.createdAt ? new Date(r.createdAt).toLocaleString() : '';

      return `<tr>
        <td>${escapeHtml(r.name)}</td>
        <td class="${statusClass}">${statusLabel}</td>
        <td>${escapeHtml(r.maybeResponseDate || '-')}</td>
        <td class="msg-cell">${escapeHtml(r.message || '-')}</td>
        <td>${date}</td>
      </tr>`;
    }).join('');

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Maybe Date</th>
            <th>Message</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function exportCSV() {
    if (!currentData.length) return;
    const headers = ['Name', 'Attending', 'Maybe Date', 'Message', 'Submitted At'];
    const rows = currentData.map(r => [
      r.name,
      r.attending ? 'Yes' : (r.maybeResponseDate ? 'Maybe' : 'No'),
      r.maybeResponseDate || '',
      (r.message || '').replace(/"/g, '""'),
      r.createdAt ? new Date(r.createdAt).toLocaleString() : ''
    ]);
    let csv = headers.join(',') + '\n';
    csv += rows.map(row => row.map(val => `"${val}"`).join(',')).join('\n');

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wedding-rsvps.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  loadRsvps();
</script>

</body>
</html>
